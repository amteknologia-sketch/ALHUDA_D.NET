name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cek struktur proyek
        run: |
          echo "Isi root repo:"; ls -la
          if [ ! -f package.json ]; then
            echo "::error::package.json tidak ada di root. Unggah ISI folder ALHUDA_D.NET, bukan foldernya."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Normalisasi proyek (buang plugin folder lama)
        run: |
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));if(p.dependencies&&p.dependencies['routeros-native']){delete p.dependencies['routeros-native'];console.log('dihapus: dep routeros-native');}fs.writeFileSync('package.json',JSON.stringify(p,null,2));"
          rm -rf plugins node_modules package-lock.json
          echo "Dependencies sekarang:"; node -e "console.log(require('./package.json').dependencies)"

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: if [ ! -d "android" ]; then npx cap add android; fi

      - name: Suntik plugin native ke modul aplikasi
        run: |
          mkdir -p android/app/src/main/java/net/alhudadnet/admin
          echo '' | base64 -d > android/app/src/main/java/net/alhudadnet/admin/RouterosPlugin.java
          echo '' | base64 -d > android/app/src/main/java/net/alhudadnet/admin/MainActivity.java
          echo "File Java di modul app:"; ls -la android/app/src/main/java/net/alhudadnet/admin

      - name: Generate icons & splash (optional)
        run: npx capacitor-assets generate --android || echo "lewati pembuatan ikon"

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ALHUDA_D.NET-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
