<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#2f6fed">
<title>ALHUDA_D.NET</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="appbar">
  <div class="brand"><img id="appLogo" alt="" style="display:none"><span id="appName">ALHUDA_D.NET</span></div>
  <select id="sessionSel" title="Pilih Router/Sesi"></select>
  <button class="iconbtn" id="refreshBtn" title="Muat ulang">⟳</button>
</header>

<main id="view" class="wrap">
  <div class="loading"><span class="spin"></span> Memuat…</div>
</main>

<nav class="tabbar" id="tabbar">
  <a data-route="beranda" class="on">
    <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>Beranda</a>
  <a data-route="pengguna">
    <svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 20a5.5 5.5 0 0 1 11 0"/><path d="M16 11h5M18.5 8.5v5"/></svg>Pengguna</a>
  <a data-route="log">
    <svg viewBox="0 0 24 24"><path d="M5 4h14v16H5z"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>Log</a>
  <a data-route="laporan">
    <svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Laporan</a>
  <a data-route="peralatan">
    <svg viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 1-5 5L4 17v3h3l5.7-5.7a4 4 0 0 0 5-5z"/></svg>Peralatan</a>
  <a data-route="peraturan">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1l2-1.5-2-3.4-2.3 1a7 7 0 0 0-1.7-1l-.35-2.5h-4L12.2 5a7 7 0 0 0-1.7 1l-2.3-1-2 3.4 2 1.5a7 7 0 0 0 0 2l-2 1.5 2 3.4 2.3-1a7 7 0 0 0 1.7 1l.35 2.5h4l.35-2.5a7 7 0 0 0 1.7-1l2.3 1 2-3.4-2-1.5a7 7 0 0 0 .1-1z"/></svg>Peraturan</a>
</nav>

<iframe id="printFrame" style="position:fixed;width:0;height:0;border:0;left:-9999px"></iframe>

<script src="js/api.js"></script>
<script src="js/app.js"></script>
</body>
</html>
